<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCGP Card Preview - Dialga ex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --card-width: 405px;
            --card-height: 567px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Stage da Carta */
        .card-stage {
            width: 270px;
            height: 377px;
            position: relative;
            perspective: 1000px;
        }

        @media (min-width: 768px) {
            .card-stage {
                width: var(--card-width);
                height: var(--card-height);
            }
        }

        /* Container da Carta com Efeito 3D Parallax */
        .custom-card {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border-radius: 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            cursor: pointer;
            will-change: transform;
        }

        @media (max-width: 767px) {
            .custom-card {
                transform: scale(calc(270 / 405));
                transform-origin: top left;
            }
        }

        /* Wrapper Principal */
        .custom-card-body-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            background: #111;
        }

        .custom-card-body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Fundo Radial Dourado */
        .custom-card-bg-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            overflow: hidden;
        }

        .custom-card-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #fff6a8 0%, #ffd700 40%, #997a00 80%, #4a3b00 100%);
            width: 100%;
            height: 100%;
        }

        .custom-card-border {
            position: absolute;
            inset: 0;
            border: 12px solid #ffd700;
            border-radius: 22px;
            pointer-events: none;
            z-index: 20;
            box-shadow: inset 0 0 15px rgba(255,215,0,0.8);
        }

        /* Efeito Holográfico / Brilho Dinâmico Parallax */
        .holo-overlay {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            z-index: 45;
            pointer-events: none;
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(
                circle at var(--holo-x, 50%) var(--holo-y, 50%),
                rgba(255, 255, 255, 0.8) 0%,
                rgba(255, 215, 0, 0.5) 25%,
                rgba(0, 255, 255, 0.3) 50%,
                transparent 80%
            );
        }

        .custom-card:hover .holo-overlay {
            opacity: 1;
        }

        /* Imagem do Pokémon - Forçada ao tamanho exato da carta */
        .custom-card-img {
            position: absolute;
            inset: 0;
            z-index: 30;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Texto com Contorno Escuro Nativo */
        .custom-card-text-stroked {
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            color: #ffffff;
            font-weight: 900;
        }

        /* Truncate de 2 linhas */
        .truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="card-stage">
        <div class="custom-card" id="tcgpCard">
            
            <!-- Efeito Holográfico de Brilho Dinâmico -->
            <div class="holo-overlay" id="holoOverlay"></div>

            <!-- Camada de Fundo, Borda e Arte do Pokémon -->
            <div class="custom-card-body-wrapper">
                <div class="custom-card-body">
                    
                    <div class="custom-card-bg-wrapper">
                        <div class="custom-card-bg"></div>
                        <div class="custom-card-border"></div>
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/70 z-25 pointer-events-none"></div>
                    </div>

                    <!-- Imagem Centralizada e Ajustada Exatamente à Carta -->
                    <div class="custom-card-img">
                        <img id="pokemonArt" alt="Dialga ex" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/example.png">
                    </div>

                </div>
            </div>

            <!-- Camada de Tipografia e Interface (Sobreposta) -->
            <div class="custom-card-text-wrapper absolute inset-0 z-50 p-[24px] text-white flex flex-col justify-between pointer-events-none">
                <div class="custom-card-text h-full flex flex-col justify-between">
                    
                    <!-- Cabeçalho: Tipo, Nome e HP -->
                    <div class="custom-card-text-head flex items-center justify-between">
                        <div class="flex items-center gap-[2px]">
                            <img class="w-[58px] h-[20px] object-contain" alt="Tipo" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/images/card-maker/card-type-pt.webp">
                            <div class="relative max-w-[160px] my-[-0.2em] text-[26px] leading-[1.4] truncate">
                                <div class="custom-card-text-stroked truncate">Dialga ex</div>
                                <div class="absolute inset-0 truncate">Dialga ex</div>
                            </div>
                            <img class="w-[42px] h-[28px] object-contain" alt="EX" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/images/card-maker/card-ex.webp">
                        </div>
                        
                        <div class="flex items-end gap-[2px]">
                            <span class="relative text-[16px] font-bold">
                                <div class="custom-card-text-stroked">HP</div>
                                <div class="absolute inset-0">HP</div>
                            </span>
                            <span class="relative text-[26px] font-bold">
                                <div class="custom-card-text-stroked">150</div>
                                <div class="absolute inset-0">150</div>
                            </span>
                            <img class="size-[26px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                        </div>
                    </div>

                    <!-- Ataques e Descrições -->
                    <div class="custom-card-text-attacks flex flex-col gap-[14px]">
                        
                        <!-- Ataque 1 -->
                        <div>
                            <div class="flex items-center gap-[6px] text-[18px] font-bold">
                                <div class="flex gap-[3px] w-[105px]">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                </div>
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Turbo Metálico</div>
                                    <div class="absolute inset-0 truncate">Turbo Metálico</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">30</div>
                                    <div class="absolute inset-0">30</div>
                                </div>
                            </div>
                            <div class="relative min-h-[1em] text-[12px] font-medium mt-[2px]">
                                <div class="custom-card-text-stroked truncate-2">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
                                <div class="absolute inset-0 truncate-2">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
                            </div>
                        </div>

                        <!-- Ataque 2 -->
                        <div>
                            <div class="flex items-center gap-[6px] text-[18px] font-bold">
                                <div class="flex gap-[3px] w-[105px]">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Colorless" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/colorless.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Colorless" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/colorless.svg">
                                </div>
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Impacto Pesado</div>
                                    <div class="absolute inset-0 truncate">Impacto Pesado</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">100</div>
                                    <div class="absolute inset-0">100</div>
                                </div>
                            </div>
                            <div class="relative min-h-[1em] text-[12px] font-medium mt-[2px]">
                                <div class="custom-card-text-stroked truncate-2"></div>
                                <div class="absolute inset-0 truncate-2"></div>
                            </div>
                        </div>

                    </div>

                    <!-- Rodapé da Carta -->
                    <img class="w-full mt-auto object-contain" alt="Rodapé" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/images/card-maker/card-bottom-pt.webp">

                </div>
            </div>

        </div>
    </div>

    <!-- Script para Parallax 3D e Rotação Dinâmica -->
    <script>
        const card = document.getElementById('tcgpCard');
        const holo = document.getElementById('holoOverlay');

        function handleMove(e) {
            const rect = card.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (!clientX || !clientY) return;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Ângulo de rotação máximo (18 graus)
            const rotateX = -((y - centerY) / centerY) * 18;
            const rotateY = ((x - centerX) / centerX) * 18;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // Atualiza posição da luz holográfica
            holo.style.setProperty('--holo-x', `${x}px`);
            holo.style.setProperty('--holo-y', `${y}px`);
        }

        function handleReset() {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.transition = 'transform 0.5s ease-out';
        }

        function handleEnter() {
            card.style.transition = 'none';
        }

        // Eventos de Mouse e Touch
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove);
        card.addEventListener('mouseleave', handleReset);
        card.addEventListener('mouseenter', handleEnter);
    </script>
</body>
</html>
