<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCGP Card Preview - Dialga ex</title>
    <style>
        :root {
            --card-width: 405px;
            --card-height: 567px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Container responsivo da carta */
        .card-stage {
            width: 270px;
            height: 377px;
            position: relative;
        }

        @media (min-width: 768px) {
            .card-stage {
                width: var(--card-width);
                height: var(--card-height);
            }
        }

        .custom-card {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            transform-origin: top left;
            user-select: none;
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        @media (max-width: 767px) {
            .custom-card {
                transform: scale(calc(270 / 405));
            }
        }

        /* Corpo principal da carta e camadas */
        .custom-card-body-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            background: #1a1a1a;
        }

        .custom-card-body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .custom-card-bg-wrapper {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        /* Fundo Radial Dourado Giratório/Estilizado */
        .custom-card-bg {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, #fff3a6 0%, #ffd700 35%, #cca100 70%, #8b6508 100%);
            animation: rotateBg 20s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Borda Externa Holográfica / Arco-íris (Estilo Gold Crown) */
        .custom-card-border {
            position: absolute;
            inset: 0;
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff) 1;
            border-radius: 22px;
            pointer-events: none;
            z-index: 2;
        }

        .custom-card-grad {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,215,0,0.2) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 3;
        }

        /* Imagem do Pokémon Centralizada */
        .custom-card-img {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .custom-card-img img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            max-width: 110%;
            max-height: 110%;
            object-fit: contain;
        }

        .custom-card-decor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Camada de Textos e Elementos da Interface da Carta */
        .custom-card-text-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            padding: 18px 22px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .custom-card-text {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Cabeçalho */
        .custom-card-text-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 10px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .flex { display: flex; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .gap-[2px] { gap: 2px; }
        .gap-[3px] { gap: 3px; }
        .gap-[6px] { gap: 6px; }
        .grow { flex-grow: 1; }
        .w-0 { width: 0; }
        .relative { position: relative; }
        .absolute { position: absolute; }
