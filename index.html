<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta Pokémon — paralaxe</title>
<style>
  :root { color-scheme: dark; --gold:#ffd76a; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
    background:radial-gradient(ellipse at 50% 38%, #222332 0, #11121a 44%, #08090e 100%);
    color:#fff; font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;
  }
  .demo { display:grid; justify-items:center; gap:18px; }
  .card-stage { width:min( min(78vw, 405px), 340px); aspect-ratio:405/567; perspective:1100px; }
  .pokemon-card {
    --rx:0deg; --ry:0deg; --px:50%; --py:50%; --depth:1;
    width:100%; height:100%; position:relative; overflow:hidden; border-radius:4.9%;
    transform-style:preserve-3d; transform:rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .14s ease-out; isolation:isolate; box-shadow:0 24px 60px #0009, 0 0 30px #e9b94020;
    background:#2d2413; cursor:pointer; touch-action:pan-y;
  }
  .pokemon-card.is-resetting { transition:transform .55s cubic-bezier(.2,.8,.2,1); }
  .art, .bg, .bg2, .border, .decor, .shine { position:absolute; inset:0; width:100%; height:100%; }
  .bg { z-index:0; object-fit:cover; transform:translateZ(-20px) scale(1.06); }
  .bg2 { z-index:1; object-fit:cover; opacity:.66; mix-blend-mode:screen; transform:translateZ(-10px) scale(1.04); }
  .art-wrap { position:absolute; z-index:2; inset:5% 5% 5%; overflow:hidden; transform:translateZ(12px); }
  .art { object-fit:contain; filter:drop-shadow(0 7px 4px #0007); }
  .decor { z-index:3; object-fit:fill; opacity:.78; mix-blend-mode:screen; transform:translateZ(24px); pointer-events:none; }
  .border { z-index:5; object-fit:fill; pointer-events:none; transform:translateZ(32px); }
  .glint { position:absolute; z-index:4; inset:0; pointer-events:none; opacity:.45; mix-blend-mode:screen;
    background:linear-gradient(118deg,transparent 25%,#fff2 42%,#fff8 48%,#fff1 53%,transparent 68%);
    background-size:240% 240%; background-position:var(--px) var(--py); transform:translateZ(28px); }
  .shine { z-index:6; pointer-events:none; opacity:0; mix-blend-mode:color-dodge; transform:translateZ(35px);
    background:radial-gradient(circle at var(--px) var(--py),#fff9 0, #6ef8ff62 16%,#ff59ca3d 35%,transparent 68%); }
  .card-copy { position:absolute; z-index:7; inset:0; padding:7.2% 8% 6%; display:flex; flex-direction:column; justify-content:space-between;
    transform:translateZ(42px); pointer-events:none; text-shadow:0 2px 3px #000, 1px 1px 2px #000; }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .name { font-size:clamp(18px,6vw,27px); font-weight:900; letter-spacing:-.04em; }
  .hp { display:flex; align-items:baseline; gap:4px; white-space:nowrap; font-weight:900; }
  .hp strong { font-size:clamp(20px,6vw,28px); }
  .type { font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; opacity:.95; }
  .attacks { margin-top:auto; padding:0 1% 13%; display:grid; gap:14px; }
  .attack { background:linear-gradient(90deg,#090909c9,#1212127a,transparent); border-radius:8px; padding:6px 8px; }
  .attack-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:clamp(13px,4vw,17px); font-weight:900; }
  .attack-desc { font-size:clamp(9px,2.7vw,11px); font-weight:600; margin-top:3px; }
  .energy { letter-spacing:2px; color:#ffe084; }
  .setmark { position:absolute; z-index:8; left:8%; bottom:3%; font-size:8px; color:#fff9; transform:translateZ(44px); pointer-events:none; }

  /* 1 — inclinação 3D clássica */
  .mode-tilt .pokemon-card:hover .shine, .mode-tilt .pokemon-card.is-active .shine { opacity:.85; }
  /* 2 — deslocamento independente da arte, fundo e moldura */
  .mode-layers .art-wrap { transform:translate3d(calc(var(--mx,0px)*1.7),calc(var(--my,0px)*1.7),18px); }
  .mode-layers .bg { transform:translate3d(calc(var(--mx,0px)*-.55),calc(var(--my,0px)*-.55),-20px) scale(1.08); }
  .mode-layers .bg2 { transform:translate3d(calc(var(--mx,0px)*-.8),calc(var(--my,0px)*-.8),-10px) scale(1.06); }
  .mode-layers .decor { transform:translate3d(calc(var(--mx,0px)*.8),calc(var(--my,0px)*.8),25px); }
  .mode-layers .card-copy { transform:translate3d(calc(var(--mx,0px)*.45),calc(var(--my,0px)*.45),42px); }
  /* 3 — paralaxe suave com brilho holográfico */
  .mode-holo .pokemon-card { transition:transform .26s cubic-bezier(.2,.8,.2,1); }
  .mode-holo .pokemon-card:hover .shine, .mode-holo .pokemon-card.is-active .shine { opacity:1; }
  .mode-holo .glint { opacity:.75; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .controls button { border:1px solid #ffffff2a; background:#ffffff0b; color:#e9e9ef; border-radius:999px; padding:9px 14px; font:600 12px system-ui; cursor:pointer; transition:.2s; }
  .controls button:hover { border-color:#ffd76a88; }
  .controls button[aria-pressed="true"] { color:#17120a; background:var(--gold); border-color:var(--gold); }
  .hint { color:#aaaab5; font-size:11px; text-align:center; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration:.01ms!important; } }
</style>
</head>
<body>
<main class="demo" id="demo">
  <div class="card-stage">
    <article class="pokemon-card" id="pokemonCard" aria-label="Carta Pokémon Dialga ex">
      <img class="bg" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-bg.webp" alt="">
      <img class="bg2" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-bg-2.webp" alt="">
      <div class="art-wrap"><img class="art" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/example.png" alt="Dialga"></div>
      <img class="decor" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-decor.webp" alt="">
      <div class="glint"></div><div class="shine"></div>
      <div class="card-copy">
        <header class="topline"><div><div class="type">Metal · Pokémon Básico</div><div class="name">Dialga ex</div></div><div class="hp"><span>HP</span><strong>150</strong></div></header>
        <section class="attacks" aria-label="Ataques">
          <div class="attack"><div class="attack-head"><span><span class="energy">● ●</span> Turbo Metálico</span><span>30</span></div><div class="attack-desc">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div></div>
          <div class="attack"><div class="attack-head"><span><span class="energy">● ● ◇ ◇</span> Impacto Pesado</span><span>100</span></div></div>
        </section>
      </div>
      <span class="setmark">Ilustração de demonstração · PTCGP</span>
      <img class="border" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-border.webp" alt="">
    </article>
  </div>
  <nav class="controls" aria-label="Modo de paralaxe">
    <button type="button" data-mode="tilt" aria-pressed="true">1 · 3D</button>
    <button type="button" data-mode="layers" aria-pressed="false">2 · Camadas</button>
    <button type="button" data-mode="holo" aria-pressed="false">3 · Holográfico</button>
  </nav>
  <div class="hint">Mova o cursor sobre a carta ou arraste com o dedo.</div>
</main>
<script>
(() => {
  const demo = document.getElementById('demo');
  const card = document.getElementById('pokemonCard');
  let raf = 0;
  function move(clientX, clientY) {
    const r = card.getBoundingClientRect();
    const x = (clientX - r.left) / r.width;
    const y = (clientY - r.top) / r.height;
    const dx = (x - .5) * 2, dy = (y - .5) * 2;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      card.style.setProperty('--rx', `${(-dy * 13).toFixed(2)}deg`);
      card.style.setProperty('--ry', `${(dx * 13).toFixed(2)}deg`);
      card.style.setProperty('--px', `${(x*100).toFixed(1)}%`);
      card.style.setProperty('--py', `${(y*100).toFixed(1)}%`);
      card.style.setProperty('--mx', `${(dx*7).toFixed(1)}px`);
      card.style.setProperty('--my', `${(dy*7).toFixed(1)}px`);
      card.classList.add('is-active');
    });
  }
  function reset() {
    card.classList.add('is-resetting'); card.classList.remove('is-active');
    ['--rx','--ry','--mx','--my'].forEach(p => card.style.setProperty(p, '0deg'));
    card.style.setProperty('--mx','0px'); card.style.setProperty('--my','0px');
    card.style.setProperty('--px','50%'); card.style.setProperty('--py','50%');
    setTimeout(() => card.classList.remove('is-resetting'), 560);
  }
  card.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' || e.buttons) move(e.clientX,e.clientY); });
  card.addEventListener('pointerleave', reset);
  card.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') move(e.clientX,e.clientY); });
  document.querySelectorAll('.controls button').forEach(button => button.addEventListener('click', () => {
    demo.classList.remove('mode-tilt','mode-layers','mode-holo');
    demo.classList.add(`mode-${button.dataset.mode}`);
    document.querySelectorAll('.controls button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
    reset();
  }));
  demo.classList.add('mode-tilt');
})();
</script>
</body>
</html>
