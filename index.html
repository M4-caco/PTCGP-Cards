<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCGP Card Preview - Teste</title>
    <style>
        :root {
            --card-width: 405px;
            --card-height: 567px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .card-stage {
            width: 270px;
            height: 377px;
            position: relative;
        }

        @media (min-width: 768px) {
            .card-stage {
                width: var(--card-width);
                height: var(--card-height);
            }
        }

        .custom-card {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            transform-origin: top left;
            user-select: none;
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        @media (max-width: 767px) {
            .custom-card {
                transform: scale(calc(270 / 405));
            }
        }

        .custom-card-body-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            background: #1a1a1a;
        }

        .custom-card-body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .custom-card-bg-wrapper {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        .custom-card-bg {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, #fff3a6 0%, #ffd700 35%, #cca100 70%, #8b6508 100%);
        }

        .custom-card-border {
            position: absolute;
            inset: 0;
            border: 10px solid #ffd700;
            border-radius: 22px;
            pointer-events: none;
            z-index: 2;
        }

        .custom-card-img {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .custom-card-img img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            max-width: 110%;
            max-height: 110%;
            object-fit: contain;
        }

        .custom-card-text-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            padding: 18px 22px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .custom-card-text {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .custom-card-text-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            border-radius: 12px;
        }

        .flex { display: flex; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .gap-\[4px\] { gap: 4px; }
        .grow { flex-grow: 1; }
        .w-0 { width: 0; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .custom-card-text-stroked {
            color: #ffffff;
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            font-weight: 900;
        }

        .card-name { font-size: 24px; }
        .hp-label { font-size: 14px; font-weight: 900; }
        .hp-value { font-size: 24px; font-weight: 900; }

        .custom-card-text-attacks {
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 14px;
            border-radius: 14px;
        }

        .attack-title { font-size: 16px; font-weight: 800; }
        .attack-desc { font-size: 11px; font-weight: 600; margin-top: 3px; }
    </style>
</head>
<body>

    <div class="card-stage">
        <div class="custom-card">
            
            <div class="custom-card-body-wrapper">
                <div class="custom-card-body">
                    <div class="custom-card-bg-wrapper">
                        <div class="custom-card-bg"></div>
                        <div class="custom-card-border"></div>
                    </div>
                    
                    <div class="custom-card-img">
                        <!-- Imagem de teste pública para garantir que abre -->
                        <img alt="Card Art" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/example.png">
                    </div>
                </div>
            </div>

            <div class="custom-card-text-wrapper">
                <div class="custom-card-text">
                    <div class="custom-card-text-head">
                        <div class="flex items-center gap-[4px]">
                            <div class="relative card-name truncate">
                                <div class="custom-card-text-stroked truncate">Dialga ex</div>
                                <div class="absolute inset-0 truncate">Dialga ex</div>
                            </div>
                        </div>
                        
                        <div class="flex items-end gap-[4px]">
                            <span class="relative hp-label">
                                <div class="custom-card-text-stroked">HP</div>
                                <div class="absolute inset-0">HP</div>
                            </span>
                            <span class="relative hp-value">
                                <div class="custom-card-text-stroked">150</div>
                                <div class="absolute inset-0">150</div>
                            </span>
                        </div>
                    </div>

                    <div class="custom-card-text-attacks">
                        <div>
                            <div class="flex items-center gap-[6px] attack-title">
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Turbo Metálico</div>
                                    <div class="absolute inset-0 truncate">Turbo Metálico</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">30</div>
                                    <div class="absolute inset-0">30</div>
                                </div>
                            </div>
                            <div class="relative attack-desc">
                                <div class="custom-card-text-stroked">Pegue 2 Energias de Metal da sua Zona de Energia.</div>
                                <div class="absolute inset-0">Pegue 2 Energias de Metal da sua Zona de Energia.</div>
                            </div>
                        </div>
                    </div>

                    <div></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
