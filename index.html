<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartas Pokémon TCG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d18;
            color: #ffffff;
        }
        h1, h2, h3, .font-title {
            font-family: 'Cabinet Grotesk', sans-serif;
        }
        .glass-panel {
            background: rgba(20, 27, 40, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        /* Estilos básicos da Carta Pokémon */
        .pokemon-card {
            width: 320px;
            height: 448px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            background: #e2e8f0;
            color: #1e293b;
            transition: all 0.3s ease;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px 8px 16px;
        }
        .card-artwork {
            width: 90%;
            height: 180px;
            margin: 0 auto;
            border: 4px solid #b45309;
            border-radius: 8px;
            overflow: hidden;
            background: #cbd5e1;
            position: relative;
        }
        .card-artwork img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Limpo (Sem abas duplicadas ou links inúteis) -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-400 to-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg">
                ⚡
            </div>
            <span class="text-xl font-extrabold tracking-wide">PTCG Pocket Card Generator</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Painel de Controles (Esquerda) -->
        <section class="lg:col-span-7 glass-panel rounded-2xl p-6 flex flex-col gap-6 shadow-2xl">
            <h2 class="text-2xl font-bold text-amber-400 border-b border-white/10 pb-3">Personalizar Carta</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nome -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-gray-300">Nome do Pokémon</label>
                    <input type="text" id="input-name" value="Pikachu" class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400 transition">
                </div>
                <!-- HP / PV -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-gray-300">Pontos de Vida (HP)</label>
                    <input type="text" id="input-hp" value="60" class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400 transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tipo -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-gray-300">Tipo Elemental</label>
                    <select id="input-type" class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400 transition">
                        <value value="Lightning">Elétrico (Lightning)</value>
                        <option value="Fire">Fogo (Fire)</option>
                        <option value="Water">Água (Water)</option>
                        <option value="Grass">Planta (Grass)</option>
                        <option value="Psychic">Psíquico (Psychic)</option>
                        <option value="Fighting">Lutador (Fighting)</option>
                    </select>
                </div>
                <!-- Imagem URL / Upload -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-gray-300">Imagem (URL)</label>
                    <input type="text" id="input-img" value="https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?w=500" class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400 transition">
                </div>
            </div>

            <hr class="border-slate-700/60">

            <!-- Ataque 1 -->
            <div class="flex flex-col gap-3">
                <h3 class="text-lg font-bold text-indigo-300">Ataque Principal</h3>
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-2 flex flex-col gap-1">
                        <label class="text-xs text-gray-400">Nome do Ataque</label>
                        <input type="text" id="input-atk1-name" value="Choque do Trovão" class="bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-400">Dano</label>
                        <input type="text" id="input-atk1-dmg" value="30" class="bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                    </div>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-400">Descrição do Efeito</label>
                    <input type="text" id="input-atk1-desc" value="Jogue uma moeda. Se der coroa, este Pokémon causa 10 de dano a si mesmo." class="bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                </div>
            </div>

        </section>

        <!-- Painel de Visualização da Carta (Direita) -->
        <section class="lg:col-span-5 flex flex-col items-center justify-center glass-panel rounded-2xl p-8 sticky top-24 shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-gray-200">Pré-visualização</h2>
            
            <!-- Carta Renderizada -->
            <div id="card-preview" class="pokemon-card flex flex-col justify-between p-4 border-4 border-amber-400">
                <!-- Cabeçalho da Carta -->
                <div class="card-header">
                    <span id="card-name-out" class="font-bold text-lg tracking-wide uppercase">Pikachu</span>
                    <div class="flex items-center gap-1 font-bold text-red-700">
                        <span class="text-xs">HP</span>
                        <span id="card-hp-out" class="text-xl">60</span>
                    </div>
                </div>

                <!-- Imagem / Arte -->
                <div class="card-artwork shadow-inner">
                    <img id="card-img-out" src="https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?w=500" alt="Pokemon Art">
                </div>

                <!-- Seção de Ataques -->
                <div class="bg-amber-100/90 rounded-xl p-3 flex flex-col gap-2 my-2 shadow-sm border border-amber-300">
                    <div class="flex justify-between items-center font-bold">
                        <span id="card-atk1-name-out" class="text-sm">Choque do Trovão</span>
                        <span id="card-atk1-dmg-out" class="text-base">30</span>
                    </div>
                    <p id="card-atk1-desc-out" class="text-[11px] leading-tight text-slate-700">Jogue uma moeda. Se der coroa, este Pokémon causa 10 de dano a si mesmo.</p>
                </div>

                <!-- Rodapé da Carta -->
                <div class="text-[10px] text-center text-slate-500 font-semibold uppercase tracking-widest">
                    PTCGP Custom Creator • Vercel Ready
                </div>
            </div>
        </section>

    </main>

    <!-- Script de Interatividade em Tempo Real -->
    <script>
        const inputName = document.getElementById('input-name');
        const inputHp = document.getElementById('input-hp');
        const inputImg = document.getElementById('input-img');
        const inputAtk1Name = document.getElementById('input-atk1-name');
        const inputAtk1Dmg = document.getElementById('input-atk1-dmg');
        const inputAtk1Desc = document.getElementById('input-atk1-desc');

        const cardNameOut = document.getElementById('card-name-out');
        const cardHpOut = document.getElementById('card-hp-out');
        const cardImgOut = document.getElementById('card-img-out');
        const cardAtk1NameOut = document.getElementById('card-atk1-name-out');
        const cardAtk1DmgOut = document.getElementById('card-atk1-dmg-out');
        const cardAtk1DescOut = document.getElementById('card-atk1-desc-out');

        function updateCard() {
            cardNameOut.textContent = inputName.value || 'Pokémon';
            cardHpOut.textContent = inputHp.value || '50';
            cardImgOut.src = inputImg.value || 'https://via.placeholder.com/300';
            cardAtk1NameOut.textContent = inputAtk1Name.value || 'Ataque';
            cardAtk1DmgOut.textContent = inputAtk1Dmg.value || '0';
            cardAtk1DescOut.textContent = inputAtk1Desc.value || '';
        }

        [inputName, inputHp, inputImg, inputAtk1Name, inputAtk1Dmg, inputAtk1Desc].forEach(input => {
            input.addEventListener('input', updateCard);
        });
    </script>
</body>
</html>
