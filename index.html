<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCGP Card Preview</title>
    <style>
        :root {
            --card-width: 405px;
            --card-height: 567px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Container de visualização e escalonamento responsivo */
        .card-stage {
            width: 270px;
            height: 377px;
            position: relative;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            .card-stage {
                width: var(--card-width);
                height: var(--card-height);
            }
        }

        .custom-card {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            transform-origin: top left;
            user-select: none;
        }

        @media (max-width: 767px) {
            .custom-card {
                transform: scale(calc(270 / 405));
            }
        }

        /* Estrutura de Camadas (Card Body) */
        .custom-card-body-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            overflow: hidden;
        }

        .custom-card-body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .custom-card-bg-wrapper {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .custom-card-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }

        .custom-card-border {
            position: absolute;
            inset: 0;
            border: 12px solid #f1c40f;
            border-radius: 20px;
            pointer-events: none;
            z-index: 2;
        }

        .custom-card-grad {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.65) 100%);
            z-index: 3;
        }

        /* Camada da Arte Central do Pokémon */
        .custom-card-img {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .custom-card-img img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1) translateX(0%) translateY(0%);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .custom-card-decor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Camada Superior de Tipografia e Detalhes */
        .custom-card-text-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            padding: 24px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .custom-card-text {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .custom-card-text-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .flex { display: flex; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .gap-\[2px\] { gap: 2px; }
        .gap-\[3px\] { gap: 3px; }
        .gap-\[6px\] { gap: 6px; }
        .grow { flex-grow: 1; }
        .w-0 { width: 0; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .type-icon {
            width: 26px;
            height: 26px;
            border: 1px solid #FFFFFF;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.3);
        }

        /* Efeito de Texto Contornado (Stroked) */
        .custom-card-text-stroked {
            color: #ffffff;
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            font-weight: 800;
        }

        .card-name {
            font-size: 26px;
            line-height: 1.4;
            max-width: 160px;
        }

        .hp-label { font-size: 16px; font-weight: 800; }
        .hp-value { font-size: 26px; font-weight: 800; }

        .custom-card-text-attacks {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .attack-title {
            font-size: 18px;
            font-weight: 700;
        }

        .attack-desc {
            min-height: 1em;
            font-size: 12px;
            font-weight: 500;
            margin-top: 2px;
            line-height: 1.3;
        }

        .custom-card-text-bottom {
            width: 100%;
            height: auto;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="card-stage">
        <div class="origin-top-left custom-card">
            
            <!-- Camadas de Fundo, Moldura e Imagem -->
            <div class="custom-card-body-wrapper">
                <div class="custom-card-body custom-card-level-4">
                    <div class="custom-card-bg-wrapper">
                        <div class="custom-card-bg"></div>
                        <div class="custom-card-border"></div>
                        <div class="custom-card-grad"></div>
                    </div>
                    
                    <div class="custom-card-img">
                        <!-- Substitua o caminho da imagem pelo arquivo correto do seu repositório -->
                        <img alt="Pokémon Card Art" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/example.png" style="transform: translate(-50%, -50%) scale(1) translateX(0%) translateY(0%);">
                        <div class="custom-card-decor"></div>
                    </div>
                </div>
            </div>

            <!-- Camada de Texto e Tipografia -->
            <div class="custom-card-text-wrapper">
                <div class="custom-card-text">
                    
                    <!-- Cabeçalho: Tipo, Nome, HP -->
                    <div class="custom-card-text-head">
                        <div class="flex items-center gap-[2px]">
                            <img class="w-[58px] h-[20px]" style="width: 58px; height: 20px;" alt="Card Type" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/images/card-maker/card-type-pt.webp">
                            <div class="relative card-name my-[-0.2em] truncate">
                                <div class="custom-card-text-stroked truncate">Dialga</div>
                                <div class="absolute inset-0 truncate">Dialga</div>
                            </div>
                            <img class="w-[42px] h-[28px]" style="width: 42px; height: 28px;" alt="Card EX" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/images/card-maker/card-ex.webp">
                        </div>
                        
                        <div class="flex items-end gap-[2px]">
                            <span class="relative hp-label">
                                <div class="custom-card-text-stroked">HP</div>
                                <div class="absolute inset-0">HP</div>
                            </span>
                            <span class="relative hp-value">
                                <div class="custom-card-text-stroked">150</div>
                                <div class="absolute inset-0">150</div>
                            </span>
                            <img class="type-icon" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                        </div>
                    </div>

                    <!-- Ataques e Descrições -->
                    <div class="custom-card-text-attacks">
                        
                        <!-- Ataque 1 -->
                        <div>
                            <div class="flex items-center gap-[6px] attack-title">
                                <div class="flex gap-[3px]" style="width: 105px;">
                                    <img class="type-icon" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                    <img class="type-icon" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                </div>
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Turbo Metálico</div>
                                    <div class="absolute inset-0 truncate">Turbo Metálico</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">30</div>
                                    <div class="absolute inset-0">30</div>
                                </div>
                            </div>
                            <div class="relative attack-desc">
                                <div class="custom-card-text-stroked">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
                                <div class="absolute inset-0">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
                            </div>
                        </div>

                        <!-- Ataque 2 -->
                        <div>
                            <div class="flex items-center gap-[6px] attack-title">
                                <div class="flex gap-[3px]" style="width: 105px;">
                                    <img class="type-icon" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                    <img class="type-icon" alt="Metal" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/metal.svg">
                                    <img class="type-icon" alt="Colorless" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/colorless.svg">
                                    <img class="type-icon" alt="Colorless" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/icons/card-aspects/colorless.svg">
                                </div>
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Impacto Pesado</div>
                                    <div class="absolute inset-0 truncate">Impacto Pesado</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">100</div>
                                    <div class="absolute inset-0">100</div>
                                </div>
                            </div>
                            <div class="relative attack-desc">
                                <div class="custom-card-text-stroked"></div>
                                <div class="absolute inset-0"></div>
                            </div>
                        </div>

                    </div>

                    <!-- Rodapé da Carta -->
                    <img class="custom-card-text-bottom" alt="Card Bottom" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/images/card-maker/card-bottom-pt.webp">
                </div>
            </div>

        </div>
    </div>

</body>
</html>
