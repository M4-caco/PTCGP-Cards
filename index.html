<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta Pokémon — paralaxe em camadas</title>
<style>
  :root { color-scheme:dark; --gold:#ffe65c; --card-w:405px; --card-h:566px; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; padding:24px 16px; display:grid; place-items:center;
    background:#0d0d16; color:#f7f5f7; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .demo { display:grid; justify-items:center; gap:14px; }
  .card-stage { width:min(var(--card-w), calc(100vw - 40px)); aspect-ratio:405/566; position:relative; }
  .pokemon-card { position:absolute; inset:0; width:100%; height:100%; user-select:none; }

  /* Os dois wrappers separados criam a mesma perspectiva independente do corpo e do texto. */
  .body-perspective, .text-perspective {
    position:absolute; inset:0; display:flex; width:100%; height:100%;
    transform:translateZ(0); perspective:1000px;
  }
  .body-perspective > *, .text-perspective > * { transform-style:preserve-3d; }
  .text-perspective { pointer-events:none; }
  .card-body {
    --color1:#ec9bb6; --color2:#ccac6f; --color3:#69e4a5; --color4:#8ec5d6; --color5:#b98cce;
    position:relative; z-index:10; display:flex; width:100%; height:100%; border-radius:24px;
    transform-style:preserve-3d; transform-origin:center; touch-action:none;
    box-shadow:-5px -5px 5px -5px var(--color1),5px 5px 5px -5px var(--color2),
      -7px -7px 10px -5px transparent,7px 7px 10px -5px transparent,
      0 0 5px 0 #ffffff00,0 55px 35px -20px #0008;
    transition:transform .5s ease, box-shadow .2s ease;
  }
  .card-body[data-active] { transition:box-shadow .1s ease-out; box-shadow:0 0 30px -5px #ff0,0 0 10px -2px #ff0; }
  .bg-window {
    position:absolute; inset:0; border-radius:24px; overflow:hidden; isolation:isolate;
  }
  .card-bg {
    position:absolute; inset:0;
    background-image:url("https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-bg.webp"),url("https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-bg-2.webp");
    background-repeat:no-repeat,no-repeat; background-position:50% 50%,50% 50%;
    background-size:465px 648px,465px 648px; transition:background-position .5s ease;
  }
  .card-border {
    position:absolute; inset:0; border-radius:24px;
    background:url("https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-border.webp") no-repeat 50%/100% 100%;
  }
  .card-grad {
    position:absolute; z-index:1; inset:0; opacity:.8; mix-blend-mode:color-dodge;
    background-repeat:no-repeat; background-position:50% 50%; background-size:300% 300%;
    filter:brightness(.8) contrast(1); transition:background-position .5s ease,opacity .5s ease;
  }
  .card-body[data-active] .card-grad {
    background-image:linear-gradient(135deg,transparent 35%,var(--color1) 44%,var(--color2) 47%,var(--color3) 50%,var(--color4) 53%,var(--color5) 56%,transparent 65%);
    background-size:250% 250%; transition:none;
  }
  .card-body[data-active] .card-bg { transition:none; }
  .card-img {
    position:relative; width:calc(100% - 33px); height:calc(100% - 36px); border-radius:4px;
    margin:auto; overflow:hidden; pointer-events:none; object-fit:cover;
    transform:translateZ(50px) scale(.95); transform-origin:center;
  }
  .card-img > img {
    position:absolute; top:50%; left:50%; width:100%; height:100%; object-fit:contain;
    transform:translate(-50%,-50%) scale(1) translateX(0%) translateY(0%);
    transform-origin:center; transition:transform .12s ease-out;
  }
  .card-decor {
    position:absolute; top:-18px; left:-12px; right:-12px; bottom:-18px;
    background:url("https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-decor.webp") no-repeat 50%/100% 100%;
    opacity:.7; filter:brightness(1.2); pointer-events:none;
  }
  .card-copy {
    position:relative; width:100%; height:100%; color:#231417; letter-spacing:-.02em;
    transition:transform .5s ease; transform-origin:center;
  }
  .card-copy[data-active] { transition:none; }
  .outlined { -webkit-text-stroke:.1em #fff; paint-order:stroke fill; }
  .card-head {
    position:absolute; top:24px; left:10px; right:21px; display:flex; justify-content:space-between;
    align-items:flex-start; font-weight:800; line-height:1; text-shadow:0 1px 1px #fff;
  }
  .name-line { display:flex; align-items:baseline; gap:5px; font-size:26px; }
  .basic { font-size:10px; color:#49432e; background:#e8e0a9; border-radius:4px; padding:2px 4px; letter-spacing:0; }
  .name { font-size:26px; font-weight:900; }
  .hp { display:flex; align-items:baseline; gap:3px; white-space:nowrap; font-size:14px; }
  .hp strong { font-size:25px; }
  .metal-dot { align-self:center; width:20px; height:20px; display:inline-grid; place-items:center; border:1px solid white; border-radius:50%; background:#69747a; color:white; font-size:11px; }
  .attacks { position:absolute; left:32px; right:32px; bottom:176px; display:flex; flex-direction:column; gap:12px; transform:translateY(50%); }
  .attack-head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; font-size:18px; font-weight:800; }
  .attack-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .energy { font-size:17px; letter-spacing:1px; color:#d9d8d0; -webkit-text-stroke:.7px #5e5d58; white-space:nowrap; }
  .damage { flex:none; }
  .attack-desc { margin-top:2px; font-size:12px; line-height:1.2; font-weight:600; }
  .footer-art {
    position:absolute; right:6px; bottom:18px; width:370px; height:65px; object-fit:contain;
  }
  .simple-glare {
    position:absolute; inset:0; border-radius:24px; z-index:11; pointer-events:none;
    opacity:0; mix-blend-mode:screen;
    background:radial-gradient(circle at var(--px,50%) var(--py,50%),#ffffff70,transparent 48%);
  }
  .mode-holo .simple-glare { opacity:.65; }

  .controls { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; }
  .controls button,.zoom-control {
    min-height:36px; border:1px solid #ffffff2b; border-radius:999px; background:#ffffff0a;
    color:#e9e8ed; padding:8px 13px; font:600 12px system-ui; cursor:pointer;
  }
  .controls button[aria-pressed="true"] { color:#17130a; background:var(--gold); border-color:var(--gold); }
  .zoom-control { display:flex; align-items:center; gap:9px; cursor:default; }
  .zoom-control input { width:120px; accent-color:var(--gold); cursor:pointer; }
  #zoomValue { min-width:38px; text-align:right; color:#fff; font-variant-numeric:tabular-nums; }
  .hint { color:#a9a8b2; font-size:11px; text-align:center; }
  @media(max-width:440px) {
    .card-head { top:5%; left:2.5%; right:5%; }
    .name-line,.name { font-size:clamp(17px,6vw,26px); }
    .hp strong { font-size:clamp(19px,6vw,25px); }
    .attacks { left:8%; right:8%; bottom:31%; }
    .attack-head { font-size:clamp(12px,4vw,18px); }
    .attack-desc { font-size:clamp(9px,2.8vw,12px); }
    .footer-art { width:91%; right:2%; height:11.5%; bottom:3%; }
    .zoom-control input { width:96px; }
  }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; } }
</style>
</head>
<body>
<main class="demo mode-layers" id="demo">
  <div class="card-stage" id="cardStage">
    <article class="pokemon-card" id="pokemonCard" aria-label="Carta Pokémon Dialga ex">
      <div class="body-perspective">
        <div class="card-body" id="cardBody">
          <div class="bg-window">
            <div class="card-bg" id="cardBg"></div>
            <div class="card-border"></div>
            <div class="card-grad" id="cardGrad"></div>
          </div>
          <div class="card-img" id="cardImg">
            <img id="pokemonArt" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/example.png" alt="Dialga">
            <div class="card-decor"></div>
          </div>
        </div>
      </div>
      <div class="text-perspective">
        <div class="card-copy" id="cardCopy">
          <header class="card-head">
            <div class="name-line"><span class="basic">BÁSICO</span><span class="name outlined">Dialga ex</span></div>
            <div class="hp"><span>HP</span><strong class="outlined">150</strong><span class="metal-dot">●</span></div>
          </header>
          <section class="attacks" aria-label="Ataques">
            <div>
              <div class="attack-head"><span class="attack-name"><span class="energy">● ●</span> Turbo Metálico</span><span class="damage outlined">30</span></div>
              <div class="attack-desc outlined">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
            </div>
            <div>
              <div class="attack-head"><span class="attack-name"><span class="energy">● ● ◇ ◇</span> Impacto Pesado</span><span class="damage outlined">100</span></div>
            </div>
          </section>
          <img class="footer-art" src="https://raw.githubusercontent.com/M4-caco/PTCGP-Cards/main/card-bottom-pt.webp" alt="">
        </div>
      </div>
      <div class="simple-glare"></div>
    </article>
  </div>
  <nav class="controls" aria-label="Modo de paralaxe">
    <button type="button" data-mode="tilt" aria-pressed="false">1 · 3D</button>
    <button type="button" data-mode="layers" aria-pressed="true">2 · Camadas</button>
    <button type="button" data-mode="holo" aria-pressed="false">3 · Holográfico</button>
    <label class="zoom-control" for="zoomRange"><span>Zoom</span><input id="zoomRange" type="range" min="70" max="130" step="1" value="100" aria-label="Zoom da arte"><output id="zoomValue">100%</output></label>
  </nav>
  <div class="hint">Mova o cursor sobre a carta. Ajuste o zoom da arte no controle.</div>
</main>
<script>
(() => {
  const demo = document.getElementById('demo');
  const stage = document.getElementById('cardStage');
  const cardBody = document.getElementById('cardBody');
  const cardCopy = document.getElementById('cardCopy');
  const cardBg = document.getElementById('cardBg');
  const cardGrad = document.getElementById('cardGrad');
  const art = document.getElementById('pokemonArt');
  const zoomRange = document.getElementById('zoomRange');
  const zoomValue = document.getElementById('zoomValue');
  let activeMode = 'layers';
  let raf = 0;

  function clamp(n,min,max) { return Math.min(Math.max(n,min),max); }
  function reset() {
    cardBody.style.transform = '';
    cardCopy.style.transform = '';
    cardBody.removeAttribute('data-active');
    cardCopy.removeAttribute('data-active');
    cardBg.style.backgroundPosition = '';
    cardGrad.style.backgroundPosition = '';
  }
  function updateLayers(clientX,clientY) {
    const rect = stage.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const offsetX = clientX - rect.left, offsetY = clientY - rect.top;
    // Reproduz a fórmula do site: amplia o deslocamento 1,5× e limita à área da carta.
    const x = clamp(w/2 + (offsetX - w/2)*1.5, 0, w);
    const y = clamp(h/2 + (offsetY - h/2)*1.5, 0, h);
    const n = Math.abs(Math.floor(100/w*x) - 100);
    const o = Math.abs(Math.floor(100/h*y) - 100);
    const mx = 50 + (n-50)/1.5;
    const my = 50 + (o-50)/1.5;
    const rx = -((my-50)/2);
    const ry = ((mx-50)/1.5*.5);
    // No original, o fundo usa N (movimento menor) e o gradiente usa v (movimento maior).
    const bgPos = `${50+(n-50)/2}% ${50+(o-50)/2}%`;
    const gradPos = `${mx}% ${my}%`;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
      cardBody.style.transform = transform;
      cardCopy.style.transform = transform;
      cardBody.dataset.active = 'true';
      cardCopy.dataset.active = 'true';
      cardBg.style.backgroundPosition = `${bgPos}, ${bgPos}`;
      cardGrad.style.backgroundPosition = gradPos;
      stage.style.setProperty('--px', `${offsetX/w*100}%`);
      stage.style.setProperty('--py', `${offsetY/h*100}%`);
    });
  }
  function updateSimpleTilt(clientX,clientY) {
    const r = stage.getBoundingClientRect();
    const dx = clamp((clientX-r.left)/r.width,0,1)-.5;
    const dy = clamp((clientY-r.top)/r.height,0,1)-.5;
    const transform = `rotateX(${-dy*30}deg) rotateY(${dx*24}deg)`;
    cardBody.style.transform = transform;
    cardCopy.style.transform = transform;
    cardBody.dataset.active = 'true'; cardCopy.dataset.active = 'true';
  }
  stage.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && !e.buttons) return;
    if (activeMode === 'layers') updateLayers(e.clientX,e.clientY);
    else updateSimpleTilt(e.clientX,e.clientY);
  });
  stage.addEventListener('pointerleave', reset);
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') {
      if (activeMode === 'layers') updateLayers(e.clientX,e.clientY);
      else updateSimpleTilt(e.clientX,e.clientY);
    }
  });
  document.querySelectorAll('.controls button').forEach(button => button.addEventListener('click', () => {
    activeMode = button.dataset.mode;
    demo.classList.remove('mode-tilt','mode-layers','mode-holo');
    demo.classList.add(`mode-${activeMode}`);
    document.querySelectorAll('.controls button').forEach(b => b.setAttribute('aria-pressed',String(b===button)));
    reset();
  }));
  function setZoom(value) {
    const scale = Number(value)/100;
    art.style.transform = `translate(-50%, -50%) scale(${scale}) translateX(0%) translateY(0%)`;
    zoomValue.value = `${value}%`;
    zoomValue.textContent = `${value}%`;
  }
  zoomRange.addEventListener('input',e => setZoom(e.target.value));
  setZoom(zoomRange.value);
})();
</script>
</body>
</html>
