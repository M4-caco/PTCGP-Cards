<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCGP Card Preview</title>
    <!-- Carrega o Tailwind CSS para que todas as classes do site original funcionem perfeitamente -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos customizados da carta do TCG Pocket */
        .custom-card {
            width: 405px;
            height: 567px;
            position: relative;
        }

        .custom-card-text-stroked {
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            color: #ffffff;
            font-weight: 900;
        }

        .custom-card-bg {
            background: radial-gradient(circle at center, #fff6a8 0%, #e6be00 45%, #997a00 100%);
        }

        .custom-card-border {
            border: 12px solid #ffd700;
            border-radius: 20px;
        }

        .custom-card-text-bottom {
            width: 100%;
            margin-top: auto;
        }

        .truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
    </style>
</head>
<body>

    <!-- Container Responsivo Idêntico ao Site de Referência -->
    <div class="w-[270px] md:w-max h-[377px] md:h-max mx-auto mb-[40px]">
        <div class="origin-top-left max-md:scale-[calc(270/405)] custom-card">
            
            <!-- Corpo e Camadas da Carta -->
            <div class="custom-card-body-wrapper absolute inset-0 rounded-[20px] overflow-hidden">
                <div class="custom-card-body relative w-full h-full">
                    
                    <div class="custom-card-bg-wrapper absolute inset-0 z-10">
                        <div class="custom-card-bg absolute inset-0"></div>
                        <div class="custom-card-border absolute inset-0 pointer-events-none z-20"></div>
                        <div class="custom-card-grad absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/60 z-30"></div>
                    </div>

                    <!-- Imagem do Pokémon -->
                    <div class="custom-card-img absolute inset-0 z-40 flex items-center justify-content overflow-hidden">
                        <!-- Substitua "./example.png" pelo caminho correto no seu repositório GitHub -->
                        <img alt="Dialga Art" src="./example.png" style="transform: translate(-50%, -50%) scale(1) translateX(0%) translateY(0%); position: absolute; top: 50%; left: 50%; max-width: none;">
                        <div class="custom-card-decor absolute inset-0 pointer-events-none z-50"></div>
                    </div>

                </div>
            </div>

            <!-- Camada de Textos e Informações -->
            <div class="custom-card-text-wrapper absolute inset-0 z-50 p-[24px] text-white flex flex-col justify-between">
                <div class="custom-card-text h-full flex flex-col justify-between">
                    
                    <!-- Cabeçalho (Tipo, Nome, HP) -->
                    <div class="custom-card-text-head flex items-center justify-between">
                        <div class="flex items-center gap-[2px]">
                            <!-- Ajuste os caminhos das imagens para a estrutura do seu repositório -->
                            <img class="w-[58px] h-[20px]" alt="Card Type" src="./images/card-maker/card-type-pt.webp">
                            <div class="relative max-w-[160px] my-[-0.2em] text-[26px] leading-[1.4] truncate">
                                <div class="custom-card-text-stroked truncate">Dialga ex</div>
                                <div class="absolute inset-0 truncate">Dialga ex</div>
                            </div>
                            <img class="w-[42px] h-[28px]" alt="Card EX" src="./images/card-maker/card-ex.webp">
                        </div>
                        
                        <div class="flex items-end gap-[2px]">
                            <span class="relative text-[16px] font-bold">
                                <div class="custom-card-text-stroked">HP</div>
                                <div class="absolute inset-0">HP</div>
                            </span>
                            <span class="relative text-[26px] font-bold">
                                <div class="custom-card-text-stroked">150</div>
                                <div class="absolute inset-0">150</div>
                            </span>
                            <img class="size-[26px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="./icons/card-aspects/metal.svg">
                        </div>
                    </div>

                    <!-- Seção de Ataques -->
                    <div class="custom-card-text-attacks flex flex-col gap-[14px]">
                        
                        <!-- Ataque 1 -->
                        <div>
                            <div class="flex items-center gap-[6px] text-[18px] font-bold">
                                <div class="flex gap-[3px] w-[105px]">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="./icons/card-aspects/metal.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="./icons/card-aspects/metal.svg">
                                </div>
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Turbo Metálico</div>
                                    <div class="absolute inset-0 truncate">Turbo Metálico</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">30</div>
                                    <div class="absolute inset-0">30</div>
                                </div>
                            </div>
                            <div class="relative min-h-[1em] text-[12px] font-medium mt-[2px]">
                                <div class="custom-card-text-stroked truncate-2">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
                                <div class="absolute inset-0 truncate-2">Pegue 2 Energias de Metal da sua Zona de Energia e anexe-as a 1 dos seus Pokémon no Banco.</div>
                            </div>
                        </div>

                        <!-- Ataque 2 -->
                        <div>
                            <div class="flex items-center gap-[6px] text-[18px] font-bold">
                                <div class="flex gap-[3px] w-[105px]">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="./icons/card-aspects/metal.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Metal" src="./icons/card-aspects/metal.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Colorless" src="./icons/card-aspects/colorless.svg">
                                    <img class="size-[24px] border border-solid border-white rounded-[50%] object-cover" alt="Colorless" src="./icons/card-aspects/colorless.svg">
                                </div>
                                <div class="relative grow w-0">
                                    <div class="custom-card-text-stroked truncate">Impacto Pesado</div>
                                    <div class="absolute inset-0 truncate">Impacto Pesado</div>
                                </div>
                                <div class="relative">
                                    <div class="custom-card-text-stroked">100</div>
                                    <div class="absolute inset-0">100</div>
                                </div>
                            </div>
                            <div class="relative min-h-[1em] text-[12px] font-medium mt-[2px]">
                                <div class="custom-card-text-stroked truncate-2"></div>
                                <div class="absolute inset-0 truncate-2"></div>
                            </div>
                        </div>

                    </div>

                    <!-- Rodapé da Carta -->
                    <img class="custom-card-text-bottom" alt="Card Bottom" src="./images/card-maker/card-bottom-pt.webp">

                </div>
            </div>

        </div>
    </div>

</body>
</html>
